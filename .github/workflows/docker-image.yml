name: Build & Publish Docker Image (python-api-gateway)

on:
  push:
    branches:
      - dev

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  bump-version-build-publish:
    runs-on: ubuntu-latest

    steps:
      # Descarga el código del repositorio con el historial completo (necesario para tags/semver)
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Obtiene el último tag Git existente (o v0.0.0 si no hay tags)
      - name: Get latest tag
        id: get_tag
        run: |
          TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "latest_tag=$TAG" >> $GITHUB_OUTPUT

      # Determina si el commit actual implica un bump MAJOR/MINOR/PATCH según el mensaje
      - name: Detect version bump (semver)
        id: versioning
        run: |
          MESSAGE="${{ github.event.head_commit.message }}"

          MAJOR=0
          MINOR=0
          PATCH=0

          if echo "$MESSAGE" | grep -q "BREAKING CHANGE"; then
            MAJOR=1
          elif echo "$MESSAGE" | grep -qE ".*!:"; then
            MAJOR=1
          elif echo "$MESSAGE" | grep -q "^feat"; then
            MINOR=1
          elif echo "$MESSAGE" | grep -q "^fix"; then
            PATCH=1
          else
            PATCH=1
          fi

          OLD=${{ steps.get_tag.outputs.latest_tag }}
          OLD=${OLD#v}

          IFS='.' read -r OMAJ OMIN OPAT <<< "$OLD"

          if [ $MAJOR -eq 1 ]; then
            NEW="$((OMAJ+1)).0.0"
          elif [ $MINOR -eq 1 ]; then
            NEW="$OMAJ.$((OMIN+1)).0"
          else
            NEW="$OMAJ.$OMIN.$((OPAT+1))"
          fi

          echo "new_version=v$NEW" >> $GITHUB_OUTPUT

      # Crea y publica un nuevo tag Git con la versión calculada
      - name: Create Git tag
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag ${{ steps.versioning.outputs.new_version }}
          git push origin ${{ steps.versioning.outputs.new_version }}

      # Construye el nombre completo de la imagen (GHCR + owner + repo) y lo normaliza a minúsculas
      - name: Normalize image name to lowercase
        id: normalize
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ github.repository_owner }}/python-api-gateway"
          IMAGE_LC=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')
          echo "image_lc=$IMAGE_LC" >> $GITHUB_OUTPUT

      # Inicia sesión en GitHub Container Registry usando el token automático de GitHub
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Construye la imagen Docker desde el Dockerfile y crea dos tags: versión específica y latest
      - name: Build Docker image
        run: |
          docker build -t ${{ steps.normalize.outputs.image_lc }}:${{ steps.versioning.outputs.new_version }} .
          docker tag ${{ steps.normalize.outputs.image_lc }}:${{ steps.versioning.outputs.new_version }} \
                     ${{ steps.normalize.outputs.image_lc }}:latest

      # Publica ambas tags de imagen (versión específica y latest) en GHCR
      - name: Push Docker image
        run: |
          docker push ${{ steps.normalize.outputs.image_lc }}:${{ steps.versioning.outputs.new_version }}
          docker push ${{ steps.normalize.outputs.image_lc }}:latest

      # Crea un release en GitHub asociado al nuevo tag de versión
      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.versioning.outputs.new_version }}
          name: Release ${{ steps.versioning.outputs.new_version }}
          body: "Automated release generated by GitHub Actions for python-api-gateway."

