name: Build & Publish Docker Image (python-api-gateway)

on:
  push:
    branches:
      - dev

permissions:
  contents: write

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: python-api-gateway
  ECS_CLUSTER: python-api-gateway-lab-cluster
  ECS_SERVICE: python-api-gateway-lab-gateway

jobs:
  bump-version-build-publish:
    runs-on: ubuntu-latest

    steps:
      # Checkout repo
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Obtener último tag
      - name: Get latest tag
        id: get_tag
        run: |
          TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "latest_tag=$TAG" >> $GITHUB_OUTPUT

      # Detectar version semver
      - name: Detect version bump
        id: versioning
        run: |
          MESSAGE="${{ github.event.head_commit.message }}"

          MAJOR=0
          MINOR=0
          PATCH=0

          if echo "$MESSAGE" | grep -q "BREAKING CHANGE"; then
            MAJOR=1
          elif echo "$MESSAGE" | grep -qE ".*!:"; then
            MAJOR=1
          elif echo "$MESSAGE" | grep -q "^feat"; then
            MINOR=1
          else
            PATCH=1
          fi

          OLD=${{ steps.get_tag.outputs.latest_tag }}
          OLD=${OLD#v}

          IFS='.' read -r OMAJ OMIN OPAT <<< "$OLD"

          if [ $MAJOR -eq 1 ]; then
            NEW="$((OMAJ+1)).0.0"
          elif [ $MINOR -eq 1 ]; then
            NEW="$OMAJ.$((OMIN+1)).0"
          else
            NEW="$OMAJ.$OMIN.$((OPAT+1))"
          fi

          echo "new_version=v$NEW" >> $GITHUB_OUTPUT

      # Crear git tag
      - name: Create Git tag
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag ${{ steps.versioning.outputs.new_version }}
          git push origin ${{ steps.versioning.outputs.new_version }}

      # Configurar credenciales AWS
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # Login en Amazon ECR
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Construir imagen Docker
      - name: Build Docker image
        run: |
          IMAGE_URI=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}

          docker build -t $IMAGE_URI:${{ steps.versioning.outputs.new_version }} .
          docker tag $IMAGE_URI:${{ steps.versioning.outputs.new_version }} $IMAGE_URI:latest

      # Push a ECR
      - name: Push Docker image
        run: |
          IMAGE_URI=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}

          docker push $IMAGE_URI:${{ steps.versioning.outputs.new_version }}
          docker push $IMAGE_URI:latest

      # Deploy a ECS
      - name: Deploy to ECS
        run: |
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ env.ECS_SERVICE }} \
            --force-new-deployment