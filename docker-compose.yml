version: "3.9"

services:
  auth-api:
    build: .
    container_name: auth-api
    env_file:
      - .env
    networks:
      - laboratory-network

  iam-api:
    build:
      context: ../python-iam-api
      dockerfile: Dockerfile
    container_name: iam-api
    env_file:
      - ../python-iam-api/.env
    depends_on:
      - mongo
    networks:
      - laboratory-network

  auth-gateway:
    image: nginx:1.27-alpine
    container_name: auth-gateway
    depends_on:
      - auth-api
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - laboratory-network

  mongo:
    image: mongo:7
    container_name: mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: rootpassword
    volumes:
      - mongodb_data:/data/db
    networks:
      - laboratory-network

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: always
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - laboratory-network

volumes:
  mongodb_data:
  redis_data:

networks:
  laboratory-network:
    driver: bridge

